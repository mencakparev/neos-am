<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    width: 512px;
    height: 512px;
    background: #f0efea;
    position: relative;
    overflow: hidden;
  }
  .glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: 380px;
    line-height: 1;
    color: #14130f;
    transform: translateY(39px); /* optical centering: cap-height sits high in the line box */
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="glyph">N</div>
  </div>
</body>
</html>
